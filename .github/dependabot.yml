version: 2
updates:
  # Python dependencies in uv.lock (ecosystem "uv"). CI must pass before any update merges;
  # nothing merges automatically.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
