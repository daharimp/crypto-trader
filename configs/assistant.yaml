# AI review assistant (ADR-039). These are assistant settings, not risk values: the assistant
# can only write reports and suggest changes; it never edits a settings file or places an order.
# The API key is read from ANTHROPIC_API_KEY in the server's .env (never put it here).
schema_version: "1.0.0"
kind: ReviewAssistant
model: claude-opus-5-5
max_tokens: 16000
# Reasoning effort per role: low, medium, high, xhigh or max (higher costs more).
effort:
  default: medium
  strategy_researcher: high
  skeptic: high
  lead_editor: high
  trade_analyst: medium
  daily_editor: medium
# Review automatically when an account journals a bad day (DAY_HALTED).
review_on_bad_day: true
accounts: [main, degen, spot-perps, top10]
# ADR-046: once a day (after 00:10 UTC) ONE request writes the daily summary and, with
# review_every_trade, a review of every trade closed that day (batched to save usage). Drawdown
# alerts are code only and alert when an account falls past a level below its peak.
review_every_trade: true
daily_summary: true
report_accounts: [main, degen, spot-perps, top10, spot]
drawdown_alert_pct: [5, 10, 15]
# ADR-048 (owner, 2026-11-23): no Anthropic API calls from the server for now. The daily
# scheduled review on the owner's Claude plan writes the daily summary and trade reviews to the
# crypto-trader-ops repo; this service keeps only the drawdown alerts. true turns them back on.
server_ai_reviews: false
# ADR-049 (owner, 2026-11-23): a free OpenRouter model reviews each paper trade soon after it
# closes; the daily Claude review reads those notes plus the raw facts. The key is read only
# from OPENROUTER_API_KEY in the server's .env; without it these reviews skip quietly. Free
# models change often: edit the list here (tried in order) when one disappears.
free_trade_reviews:
  enabled: true
  models:
    - nvidia/nemotron-3-ultra-550b-a55b:free
    - google/gemma-4-31b-it:free
  reasoning_effort: medium
  max_tokens: 4000
  retries: 1
  # Free accounts get 50 requests a day (1,000 after a one-time $10 credit purchase) and
  # failed requests count; raise this after the top-up.
  daily_call_budget: 45
  lookback_hours: 24
