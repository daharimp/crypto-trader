# Live-trading authorization (ADR-023). Every `live` run re-checks this file.
# UD-22 approved by the owner on 2026-11-02: $250 cap, 42 paper cycles (about one week).
# Live trading still refuses to start (exit 2) until the owner adds the acknowledgement block
# below in their own words, with a version increment.
schema_version: "1.0.0"
kind: LiveAuthorization
version: 3
exchange: kraken
# The bot assumes it is the only thing trading BTC and ETH in this account; reconciliation
# compares its ledger with the exchange balances and halts on any mismatch.
account_type: spot_dedicated
# Maximum USD the bot may manage, even if the account holds more.
max_capital_usd: {value: 250, status: approved, ref: UD-22, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-02"}
# Completed forward paper cycles (4h each) this profile version needs before live is allowed.
min_paper_cycles_before_live: {value: 42, status: approved, ref: UD-22, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-02"}
# Names of the environment variables holding the Kraken API key (never put keys in this file).
api_key_env: {key: KRAKEN_API_KEY, secret: KRAKEN_API_SECRET}
acknowledgement:
  acknowledged_by: Dahari Morgan-Parker
  acknowledged_at_utc: "2026-11-15T20:07:28Z"
  statement: "We finally got to version 4, or maybe it's version 3. This is my acknowledgement statement, just acknowledging that real money can possibly be lost here. Thank you."

