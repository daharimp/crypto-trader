# Jupiter Perps, PAPER ONLY (ADR-025). No wallet, no keys, no transactions.
# UD-23: the owner approved starting collateral and every risk limit on 2026-11-02 (v2).
# Venue values were checked against docs.jup.ag and approved by the owner on 2026-11-10 (v3); borrow set to the cautious assumption (v4); 10% of equity per position (v5); trades open at 12x (UD-25, v6); each opening leverage is assessed from volatility, up to 12x (UD-26, v7); ceiling raised to 25x with a 3.5% minimum liquidation distance (UD-27, v8); borrow fee set to the rate in Jupiter's documented example (UD-28, v9).
# Venue values (costs, venue_limits) must be checked against Jupiter's current docs:
# https://dev.jup.ag and https://station.jup.ag/guides/perpetual-exchange
schema_version: "1.0.0"
kind: PerpsConfig
version: 9
venue: jupiter_perps
mode: paper
starting_collateral_usd: {value: 2500, status: approved, ref: UD-23, approved_by: owner, approved_on: "2026-11-02"}
markets:
  # Token mints used only to read public USD prices (verify against Jupiter's token list).
  - {market: SOL, price_mint: So11111111111111111111111111111111111111112}
  - {market: ETH, price_mint: 7vfCXTUXx5WJV5JADk17DUJ4ksgau7utNKj4b963voxs}
  - {market: BTC, price_mint: 3NZ9JMVBmGAqocybic2c7LQCJScmgsAZ6vQqTDzcqmJh}
costs:
  open_fee_bps: {value: 7, status: approved, ref: UD-23, approved_by: owner, approved_on: "2026-11-10", note: "0.06% base + 0.01% minimum price impact (docs.jup.ag fees, 2026-11-10)"}
  close_fee_bps: {value: 7, status: approved, ref: UD-23, approved_by: owner, approved_on: "2026-11-10", note: "0.06% base + 0.01% minimum price impact (docs.jup.ag fees, 2026-11-10)"}
  borrow_rate_pct_per_hour: {value: 0.0016, status: approved, ref: UD-28, approved_by: owner, approved_on: "2026-11-12", note: "the rate in Jupiter's documented worked example (docs.jup.ag fees, read 2026-11-12; about 14% of position size a year; the real rate changes with pool utilization). Replaces the cautious 0.01%/h after EXP-2026-014 measured 6-14% a year on other venues; $1.92/day on a $5,000 position"}
venue_limits:
  maintenance_bps: {value: 20, status: approved, ref: UD-23, approved_by: owner, approved_on: "2026-11-10", note: "liquidation at size/500 (docs.jup.ag liquidation, 2026-11-10)"}
  venue_max_leverage: {value: 250, status: approved, ref: UD-23, approved_by: owner, approved_on: "2026-11-10", note: "trading maximum (docs.jup.ag positions, 2026-11-10)"}
risk:
  max_leverage: {value: 25, status: approved, ref: UD-23, approved_by: owner, approved_on: "2026-11-02"}
  target_leverage: {value: 25, status: approved, ref: UD-27, approved_by: owner, approved_on: "2026-11-12", note: "ceiling for the assessed opening leverage; raised from 12 so a calm market can open higher"}
  liquidation_buffer_daily_moves: {value: 4, status: approved, ref: UD-26, approved_by: owner, approved_on: "2026-11-12", note: "each new position opens at the leverage that keeps liquidation this many typical daily moves (30-day) away, never above target_leverage"}
  max_collateral_per_position_pct: {value: 10, status: approved, ref: UD-23, approved_by: owner, approved_on: "2026-11-10", note: "% of equity posted per position"}
  max_total_size_pct_of_equity: {value: 400, status: approved, ref: UD-23, approved_by: owner, approved_on: "2026-11-02", note: "sum of open position sizes as % of equity"}
  min_liquidation_distance_pct: {value: 3.5, status: approved, ref: UD-27, approved_by: owner, approved_on: "2026-11-12", note: "refuse opens whose liquidation price is closer than this; lowered from 8 so 25x (about 3.7% away) is allowed"}
  max_open_positions: {value: 3, status: approved, ref: UD-23, approved_by: owner, approved_on: "2026-11-02"}
  daily_loss_limit_pct: {value: 15, status: approved, ref: UD-23, approved_by: owner, approved_on: "2026-11-02"}
