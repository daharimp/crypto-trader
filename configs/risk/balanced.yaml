# Document 3: Balanced (copy to configs/risk/balanced.yaml). Initial profile (D-09).
# Only the four concentration values are set, as HYPOTHESES H-01..H-04 (D-28).
schema_version: "1.0.0"
kind: RiskProfile
risk_profile_id: balanced
version: 2
display_name: Balanced
description: >-
  Initial profile (D-09) for the objective in D-05. Concentration values are testable starting
  hypotheses (H-01 to H-04), not permanent production limits (D-28). All other numeric values
  are unresolved.
selection:
  initial_default: true
  explicit_selection_required: false
global_hard_constraints:
  funds: simulated
  instrument_types: [spot]
  leverage_allowed: false
  margin_allowed: false
  short_selling_allowed: false
  withdrawals_allowed: false
  deterministic_final_authority: true
  ai_may_override_limits: false
  profile_switching: owner_only
loss_response:
  reassess_signals_and_conditions_each_cycle: true
  size_reduction_schedule: {method: stepwise_fraction_of_breaker, steps: [{drawdown_fraction_of_breaker_below: 0.3333, multiplier: 1.0}, {drawdown_fraction_of_breaker_below: 0.6667, multiplier: 0.5}, {drawdown_fraction_of_breaker_below: 1.0, multiplier: 0.25}], status: approved, ref: UD-15, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
  hard_thresholds_override_all: true
  circuit_breaker_stops_new_trades: true
limits:
  portfolio_drawdown_circuit_breaker_pct: {value: 15, status: approved, ref: UD-01, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
  daily_loss_limit_pct: {value: 3, status: approved, ref: UD-02, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
  daily_loss_window: utc_calendar_day
  circuit_breaker_reset: owner_command_with_reason
sizing:
  risk_per_trade_pct: {value: 1.0, status: approved, ref: UD-03, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
  hard_stop_policy: {method: atr_multiple, timeframe: decision_timeframe, atr_period_bars: 14, atr_multiple: 2.0, status: approved, ref: UD-16, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
  adaptation:
    downward: loss_response_schedule
    upward_enabled: false
    upward_multiplier_max: {value: 1, status: approved, ref: UD-15, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
  quantity_rounding: round_down_to_instrument_step
concentration:
  applies_to: aggregate_exposure_across_sleeves
  core_per_asset_cap_pct: {value: 35, status: hypothesis, ref: H-01}
  major_per_asset_cap_pct: {value: 15, status: hypothesis, ref: H-02}
  speculative_per_asset_cap_pct: {value: 5, status: hypothesis, ref: H-03}
  speculative_total_cap_pct: {value: 10, status: hypothesis, ref: H-04}
allocation:
  total_exposure_cap_pct: {value: 80, status: approved, ref: UD-12, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
  minimum_reserve_pct_range: {low: 20, high: 40, status: approved, ref: UD-04, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
  max_open_positions: {value: 5, status: approved, ref: UD-12, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
  intraday_allocation_cap_pct: {value: TBD, status: unresolved, ref: UD-14, candidates_under_test: [5, 10, 15, 20]}
  intraday_sleeve_limits:
    isolation: separate_ledger_no_borrowing_from_core
    daily_loss_limit_pct: {value: TBD, status: unresolved, ref: UD-14}
    drawdown_circuit_breaker_pct: {value: TBD, status: unresolved, ref: UD-14}
cooldown:
  after_consecutive_losing_trades:
    scope: strategy_instrument
    count: {value: 3, status: approved, ref: UD-17, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
    duration_hours: {value: 24, status: approved, ref: UD-17, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
data_and_execution_faults:
  stale_data:
    definition: missing_latest_expected_closed_candle
    action: block_new_orders_for_instrument
    paper_grace_seconds: {value: 120, status: approved, ref: UD-17, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
    escalate_to_kill_switch_after_stale_cycles: {value: 3, status: approved, ref: UD-17, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
  exchange_errors:
    retry_policy: idempotent_operations_only
    max_consecutive_errors_before_kill_switch: {value: 3, status: approved, ref: UD-17, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
  clock_skew_tolerance_seconds: {value: 5, status: approved, ref: UD-17, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
  reconciliation:
    internal_simulator: exact_match
    external_adapter_quantity_tolerance: {value: venue_lot_size, status: approved, ref: UD-17, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
kill_switch:
  state_model:
    values: [disengaged, engaged]
    source: operational_store
    persisted_across_restarts: true
    initial_state_on_first_start: disengaged
  manual_engage: always_available
  manual_disengage: owner_command_with_reason
  automated_disengage_allowed: false
  ai_may_change_state: false
  effect_on_new_orders: block_all
  auto_engage_triggers:
    - reconciliation_mismatch
    - repeated_execution_errors
    - clock_skew_exceeded
    - journal_write_failure
    - risk_config_invalid_mid_session
    - persistent_stale_data
halt_and_liquidation:
  interim_behavior_until_resolved: hold_unchanged_including_attached_stops
  liquidation_policy_after_halt: {value: hold_with_owner_flatten_command, status: approved, ref: UD-19, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
