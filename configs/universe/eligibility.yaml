# Eligibility rules. UD-18 option A and UD-06 option A approved by the owner on 2026-11-01.
schema_version: "1.0.0"
kind: EligibilityRules
version: 3
criteria:
  liquidity:
    metric: median_daily_quote_volume_usd_30d
    min_by_tier:
      core: {value: 50000000, status: approved, ref: UD-18, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
      major: {value: 10000000, status: approved, ref: UD-18, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
      speculative: {value: 1000000, status: approved, ref: UD-18, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
  data_history:
    metric: days_of_continuous_history
    min_by_tier:
      core: {value: 365, status: approved, ref: UD-18, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
      major: {value: 365, status: approved, ref: UD-18, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
      speculative: {value: 180, status: approved, ref: UD-18, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
  spread:
    metric: median_relative_spread_bps
    max_by_tier:
      core: {value: 10, status: approved, ref: UD-18, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
      major: {value: 25, status: approved, ref: UD-18, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
      speculative: {value: 50, status: approved, ref: UD-18, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
    when_no_spread_data: {value: not_applicable, status: approved, ref: UD-18, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-01"}
  support: {rule: instrument_has_market_mapping_for_active_venue}
  explicit_exclusion: {rule: not_in_profile_disallowed_assets_and_not_registry_blocked}
tier_assignment:  # UD-06 option B (2026-11-02): owner-curated list in configs/universe/assets.yaml
  core: owner_approved_only
  major: {value: owner_curated_list, status: approved, ref: UD-06, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-02"}
  speculative: {value: owner_curated_list, status: approved, ref: UD-06, approved_by: Dahari Morgan-Parker, approved_on: "2026-11-02"}
