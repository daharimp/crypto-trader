# Usage (see docs/operations/RUNBOOK.md):
#   docker compose build
#   docker compose up -d paper                       # forward paper session
#   docker compose --profile live up -d live         # real money (only after the runbook gates)
#   docker compose run --rm cli session status       # any trader command
#   docker compose up -d dashboard                   # read-only phone dashboard (ADR-025)
# Project name keeps these containers separate from other stacks on the same server (n8n).
name: crypto-trader
x-trader: &trader
  build: .
  env_file: .env
  volumes:
    - ./data:/app/data
    - ./configs:/app/configs:ro
  restart: unless-stopped
  stop_grace_period: 60s
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  paper:
    <<: *trader
    command: ["session", "run", "--profile", "configs/profiles/balanced-paper.yaml",
              "--environment", "paper"]

  live:
    <<: *trader
    profiles: ["live"]  # never starts unless explicitly requested with --profile live
    command: ["session", "run", "--profile", "configs/profiles/balanced-paper.yaml",
              "--environment", "live"]

  dashboard:
    <<: *trader
    command: ["ui", "serve", "--host", "0.0.0.0", "--port", "8787"]
    # Reason: published on the server's localhost only; Tailscale serves it to your devices.
    ports: ["127.0.0.1:8787:8787"]
    volumes:
      - ./data:/app/data:ro
      - ./configs:/app/configs:ro

  cli:
    <<: *trader
    profiles: ["cli"]
    restart: "no"
    entrypoint: ["/app/.venv/bin/trader"]
