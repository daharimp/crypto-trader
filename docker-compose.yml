# Usage (see docs/operations/RUNBOOK.md):
#   docker compose build                             # builds the one shared image (ADR-036)
#   docker compose up -d paper                       # forward paper session
#   docker compose --profile live up -d live         # real money (only after the runbook gates)
#   docker compose run --rm cli session status       # any trader command
#   docker compose up -d dashboard                   # read-only phone dashboard (ADR-026)
#   docker compose up -d perps                       # paper leverage practice (ADR-031)
# Project name keeps these containers separate from other stacks on the same server (n8n).
name: crypto-trader
# Reason: every service runs the same image, crypto-trader:local (ADR-036). Only `paper`
# builds it, so a plain `docker compose build` refreshes the code for every service, including
# the profile-gated cli, builder and live services that a plain build skips. pull_policy never
# stops Compose from ever looking for this name on Docker Hub.
x-trader: &trader
  image: crypto-trader:local
  pull_policy: never
  env_file: .env
  volumes:
    - ./data:/app/data
    - ./configs:/app/configs:ro
  restart: unless-stopped
  stop_grace_period: 60s
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  paper:
    <<: *trader
    build: .  # the only build in this file: never move it to a profile-gated service
    command: ["session", "run", "--profile", "${TRADER_PROFILE:-configs/profiles/balanced-paper.yaml}",
              "--environment", "paper"]

  # Paper-only leverage practice, long and short, on live prices (ADR-031). It has no keys
  # and cannot place a real order.
  perps:
    <<: *trader
    command: ["perps", "paper", "run"]

  live:
    <<: *trader
    profiles: ["live"]  # never starts unless explicitly requested with --profile live
    command: ["session", "run", "--profile", "${TRADER_PROFILE:-configs/profiles/balanced-paper.yaml}",
              "--environment", "live"]

  dashboard:
    <<: *trader
    command: ["ui", "serve", "--host", "0.0.0.0", "--port", "8787"]
    # Reason: published on the server's localhost only; Tailscale serves it to your devices.
    ports: ["127.0.0.1:8787:8787"]
    volumes:
      - ./data:/app/data:ro
      - ./configs:/app/configs:ro

  cli:
    <<: *trader
    profiles: ["cli"]
    restart: "no"
    entrypoint: ["/app/.venv/bin/trader"]

  # Owner-only: the profile builder is the one service that may write configs (ADR-024).
  # The bot services keep configs read-only.
  builder:
    <<: *trader
    profiles: ["cli"]
    restart: "no"
    entrypoint: ["/app/.venv/bin/trader", "profile", "build", "--docs-dir", "docs/profiles"]
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./docs/profiles:/app/docs/profiles
