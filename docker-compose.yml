# Usage (see docs/operations/RUNBOOK.md):
#   docker compose build
#   docker compose up -d paper                       # forward paper session
#   docker compose --profile live up -d live         # real money (only after the runbook gates)
#   docker compose run --rm cli session status       # any trader command
x-trader: &trader
  build: .
  env_file: .env
  volumes:
    - ./data:/app/data
    - ./configs:/app/configs:ro
  restart: unless-stopped
  stop_grace_period: 60s
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  paper:
    <<: *trader
    command: ["session", "run", "--profile", "${TRADER_PROFILE:-configs/profiles/balanced-paper.yaml}",
              "--environment", "paper"]

  live:
    <<: *trader
    profiles: ["live"]  # never starts unless explicitly requested with --profile live
    command: ["session", "run", "--profile", "${TRADER_PROFILE:-configs/profiles/balanced-paper.yaml}",
              "--environment", "live"]

  cli:
    <<: *trader
    profiles: ["cli"]
    restart: "no"
    entrypoint: ["/app/.venv/bin/trader"]

  # Owner-only: the profile builder is the one service that may write configs (ADR-024).
  # The bot services keep configs read-only.
  builder:
    <<: *trader
    profiles: ["cli"]
    restart: "no"
    entrypoint: ["/app/.venv/bin/trader", "profile", "build", "--docs-dir", "docs/profiles"]
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./docs/profiles:/app/docs/profiles
