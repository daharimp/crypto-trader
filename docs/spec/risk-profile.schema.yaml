  major_per_asset_cap_pct: {value: TBD, status: unresolved, ref: UD-13}
  speculative_per_asset_cap_pct: {value: TBD, status: unresolved, ref: UD-13}
  speculative_total_cap_pct: {value: TBD, status: unresolved, ref: UD-13}
allocation:
  total_exposure_cap_pct: {value: TBD, status: unresolved, ref: UD-12}
  minimum_reserve_pct_range: {low: TBD, high: TBD, status: unresolved, ref: UD-04}
  max_open_positions: {value: TBD, status: unresolved, ref: UD-12}
