[project]
name = "ai-crypto-trader"
version = "0.1.0"
description = "AI-assisted crypto paper-trading research system (simulated funds only)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "python-dotenv>=1.0",
  # Kraken market data and the live adapter (ADR-023).
  "ccxt>=4.3",
]

[project.scripts]
trader = "trader.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs",
  "types-PyYAML",
  "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["trader"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/spec"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Reason: QuantConnect algorithms must use LEAN's `from AlgorithmImports import *` (ADR-026).
"research/lean/*.py" = ["F403", "F405"]
# Reason: research scripts print wide result tables.
"research/*.py" = ["E501"]

[tool.ruff.format]
# Reason: black-compatible formatting (CLAUDE.md asks for black; ruff format is a drop-in).
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["trader.domain.*", "trader.risk.*"]
strict = true

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
