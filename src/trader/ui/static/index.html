<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1214">
<title>Trader Desk</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <h1>Trader Desk</h1>
  <div class="hdr">
    <span id="ks" class="pill muted">kill switch …</span>
    <button type="button" class="btn" id="layoutBtn" aria-haspopup="true" aria-expanded="false" aria-controls="layoutMenu">Layout</button>
    <div class="menu" id="layoutMenu" hidden></div>
  </div>
</header>

<!-- Widgets are built by widgets.js; drag a card's header to move it, tap its title to open it. -->
<main class="desk" id="desk" aria-label="Dashboard widgets"></main>
<div class="scrim" id="scrim" hidden></div>
<p class="sr" id="live" aria-live="polite"></p>

<p class="note foot">Read-only view. It cannot place trades or change settings. Simulated results are not a forecast; profit is not guaranteed. Your layout is saved in this browser only.</p>

<!-- TradingView Lightweight Charts 4.2.0 (Apache-2.0), bundled: see vendor/LIGHTWEIGHT-CHARTS-LICENSE.txt -->
<script src="/vendor/lightweight-charts-4.2.0.js"></script>
<script src="/desk.js"></script>
<script src="/widgets.js"></script>
</body>
</html>
