<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f4">
<title>Trader Desk</title>
<link rel="stylesheet" href="/app.css">
<!-- Sets light or dark before the page paints, so it never flashes the wrong one. -->
<script src="/theme.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Trader Desk</h1>
    <p class="muted" id="sub">Read-only</p>
  </div>
  <div class="seg" id="acct" role="group" aria-label="Account">
    <button type="button" data-v="perps" aria-pressed="true">Leverage · paper</button>
    <button type="button" data-v="degen" aria-pressed="false">Degen · paper</button>
    <button type="button" data-v="spot" aria-pressed="false">Spot</button>
    <button type="button" data-v="all" aria-pressed="false">All</button>
  </div>
  <div class="hdr">
    <span id="ks" class="pill muted">kill switch …</span>
    <button type="button" class="iconbtn" id="lookBtn" aria-label="Appearance">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4"/><path class="fill" d="M10 6a4 4 0 0 1 0 8z"/><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.4 1.4M14.6 14.6 16 16M4 16l1.4-1.4M14.6 5.4 16 4"/></svg>
    </button>
  </div>
</header>

<!-- Swipe sideways, use the arrow keys, or tap a name to slide between sections. -->
<nav class="tabs" id="tabs" aria-label="Sections">
  <button type="button" data-page="overview">Overview</button>
  <button type="button" data-page="positions">Positions</button>
  <button type="button" data-page="trades">Trades</button>
  <button type="button" data-page="markets">Markets</button>
  <span class="ink" id="ink" aria-hidden="true"></span>
</nav>

<main class="pager" id="pager">
  <section class="page" id="p-overview" aria-label="Overview"><div class="wrap" id="overview"></div></section>
  <section class="page" id="p-positions" aria-label="Positions"><div class="wrap" id="positions"></div></section>
  <section class="page" id="p-trades" aria-label="Trades"><div class="wrap" id="trades"></div></section>
  <section class="page" id="p-markets" aria-label="Markets"><div class="wrap" id="markets"></div></section>
</main>

<div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details" inert>
  <span class="handle" aria-hidden="true"></span>
  <div id="sheetBody"></div>
  <button type="button" class="btn" id="sheetClose">Close</button>
</aside>
<p class="sr" id="live" aria-live="polite"></p>

<!-- TradingView Lightweight Charts 4.2.0 (Apache-2.0), bundled: see vendor/LIGHTWEIGHT-CHARTS-LICENSE.txt -->
<script src="/vendor/lightweight-charts-4.2.0.js"></script>
<script src="/desk.js"></script>
<script src="/views.js"></script>
<script src="/markets.js"></script>
</body>
</html>
